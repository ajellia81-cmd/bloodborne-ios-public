name: iOS Metal runtime build
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-metal.yml'
      - 'scripts/fetch-ios-deps.py'
      - 'scripts/package-native.sh'
      - 'native/**'
permissions:
  contents: read
concurrency:
  group: ios-metal-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Fetch runtime and game-free submodules
        run: |
          set -euo pipefail
          mkdir -p output
          git clone --depth 1 https://github.com/bloodborne-native/bloodborne-runtime.git upstream-runtime
          git -C upstream-runtime submodule update --init --depth 1 recomp third_party/LibAtrac9 gpu/third_party/imgui
          git -C upstream-runtime rev-parse HEAD | tee output/runtime-sha.txt
      - name: Install host shader tools
        run: brew install glslang pkgconf nasm bash
      - uses: actions/cache/restore@v4
        id: ios-deps-cache
        with:
          path: |
            upstream-runtime/deps/ios-arm64
            upstream-runtime/deps/build-ios
          key: ios-metal-xcode26.3-${{ hashFiles('upstream-runtime/deps/packages.cmake', 'upstream-runtime/scripts/ios/build-deps.sh') }}
      - name: Fetch pinned iOS dependency sources
        run: python3 scripts/fetch-ios-deps.py
      - name: Build upstream iOS dependency libraries
        run: |
          set -euo pipefail
          bash upstream-runtime/scripts/ios/build-deps.sh 2>&1 | tee output/deps-build.log
      - uses: actions/cache/save@v4
        if: steps.ios-deps-cache.outputs.cache-hit != 'true'
        with:
          path: |
            upstream-runtime/deps/ios-arm64
            upstream-runtime/deps/build-ios
          key: ${{ steps.ios-deps-cache.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        id: ios-gpu-cache
        with:
          path: upstream-runtime/out/ios/gpu
          key: ios-gpu-xcode26.3-${{ hashFiles('output/runtime-sha.txt', 'upstream-runtime/deps/packages.cmake') }}
      - name: Build actual iOS Metal GPU library
        if: steps.ios-gpu-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          bash upstream-runtime/scripts/ios/build-gpu.sh 2>&1 | tee output/gpu-build.log
      - uses: actions/cache/save@v4
        if: steps.ios-gpu-cache.outputs.cache-hit != 'true'
        with:
          path: upstream-runtime/out/ios/gpu
          key: ${{ steps.ios-gpu-cache.outputs.cache-primary-key }}
      - name: Build actual runtime without GPU stubs
        run: |
          set -euo pipefail
          /opt/homebrew/bin/bash upstream-runtime/scripts/ios/build-core.sh 2>&1 | tee output/core-build.log
          cp upstream-runtime/out/ios/libbbios.a output/
          cp upstream-runtime/out/ios/gpu/libbbgpu.a output/
      - name: Package full native runtime unsigned IPA
        run: |
          set -euo pipefail
          bash scripts/package-native.sh 2>&1 | tee output/package-build.log
      - name: Collect GPU compiler diagnostics
        if: always()
        run: |
          if [ -f upstream-runtime/out/ios/gpu-build.log ]; then
            cp upstream-runtime/out/ios/gpu-build.log output/gpu-full-build.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-metal-runtime-diagnostics
          path: output/
          retention-days: 14
