name: iOS Metal runtime build
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-metal.yml'
      - 'scripts/fetch-ios-deps.py'
      - 'scripts/package-native.sh'
      - 'scripts/patch-interpreter-diagnostics.py'
      - 'scripts/patch-ios-memory-budget.py'
      - 'scripts/patch-ios-progress.py'
      - 'scripts/patch-ios-touch-menu.py'
      - 'scripts/patch-ios-lifecycle.py'
      - 'tests/lifecycle_gate.c'
      - 'scripts/patch-ios-locale.py'
      - 'scripts/patch-ios-streaming.py'
      - 'scripts/patch-ios-pso-cache.py'
      - 'tests/pso_cache_policy.cpp'
      - 'tests/locale_selection.c'
      - 'scripts/patch-ios-tessellation.py'
      - 'scripts/patch-ios-observers.py'
      - 'tests/tess*'
      - 'tests/haptics_warmup.c'
      - 'tests/haptic_mock/**'
      - 'native/**'
permissions:
  contents: read
concurrency:
  group: ios-metal-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Fetch runtime and game-free submodules
        id: runtime_pin
        run: |
          set -euo pipefail
          mkdir -p output
          git init upstream-runtime
          git -C upstream-runtime remote add origin https://github.com/bloodborne-native/bloodborne-runtime.git
          git -C upstream-runtime fetch --depth 1 origin 14dbd84263b3a08d001eb7fb1128e98f4c5f2be9
          git -C upstream-runtime checkout --detach FETCH_HEAD
          git -C upstream-runtime submodule update --init --depth 1 recomp third_party/LibAtrac9 gpu/third_party/imgui
          git -C upstream-runtime rev-parse HEAD | tee output/runtime-sha.txt
          echo "sha=$(git -C upstream-runtime rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Normalize immutable upstream source timestamps
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import os
          for p in Path('upstream-runtime').rglob('*'):
              if p.is_file() and not p.is_symlink() and not any(x in p.parts for x in ('.git','deps','out')):
                  os.utime(p,(946684800,946684800))
          PYCODE
      - name: Apply iOS touch and menu fixes
        run: |
          python3 scripts/patch-ios-touch-menu.py
          python3 scripts/patch-ios-lifecycle.py
          python3 scripts/patch-ios-streaming.py
          python3 scripts/patch-ios-pso-cache.py
          python3 scripts/patch-ios-tessellation.py
          python3 scripts/patch-ios-observers.py
          clang++ -std=c++20 -Wall -Wextra -Werror -Inative tests/tess_inputs.cpp -o output/tess-inputs-test
          output/tess-inputs-test
          clang -std=c11 -Wall -Wextra -Werror -Itests/haptic_mock -Inative native/haptics.c tests/haptics_warmup.c -o output/haptics-test
          output/haptics-test
          clang++ -std=c++20 -Wall -Wextra -Werror -pthread -Inative tests/pso_cache_policy.cpp -o output/pso-cache-test
          output/pso-cache-test
          clang -std=c11 -Wall -Wextra -Werror -pthread -Inative native/lifecycle.c tests/lifecycle_gate.c -o output/lifecycle-test
          output/lifecycle-test
          clang -std=c11 -Wall -Wextra -Werror -pthread -Inative native/locale.c tests/locale_selection.c -o output/locale-test
          output/locale-test
      - name: Install host shader tools
        run: |
          brew install glslang spirv-tools pkgconf nasm bash
          clang++ -std=c++20 -Wall -Wextra -Werror -Inative tests/tess_inputs_transform.cpp -o output/tess-transform
          spirv-as --target-env vulkan1.1 tests/tess_patch.spvasm -o output/tess-original.spv
          spirv-val --target-env vulkan1.1 output/tess-original.spv
          output/tess-transform output/tess-original.spv output/tess-transformed.spv
          spirv-val --target-env vulkan1.1 output/tess-transformed.spv
      - uses: actions/cache/restore@v4
        id: ios-deps-cache
        with:
          path: |
            upstream-runtime/deps/ios-arm64
            upstream-runtime/deps/build-ios
          key: ios-metal-xcode26.3-${{ runner.arch }}-${{ hashFiles('upstream-runtime/deps/packages.cmake', 'upstream-runtime/scripts/ios/build-deps.sh') }}
      - name: Fetch pinned iOS dependency sources
        run: python3 scripts/fetch-ios-deps.py
      - name: Build upstream iOS dependency libraries
        run: |
          set -euo pipefail
          bash upstream-runtime/scripts/ios/build-deps.sh 2>&1 | tee output/deps-build.log
      - uses: actions/cache/save@v4
        if: steps.ios-deps-cache.outputs.cache-hit != 'true'
        with:
          path: |
            upstream-runtime/deps/ios-arm64
            upstream-runtime/deps/build-ios
          key: ${{ steps.ios-deps-cache.outputs.cache-primary-key }}
      - name: Check native display profile behavior
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang -std=gnu11 -Wall -Wextra -Werror -Iupstream-runtime/deps/ios-arm64/include native/display.c tests/display_profile.c -o output/display-profile-test
          output/display-profile-test | tee output/display-profile-test.txt
      - uses: actions/cache/restore@v4
        id: ios-gpu-cache
        with:
          path: upstream-runtime/out/ios/gpu
          key: ios-gpu-xcode26.3-${{ steps.runtime_pin.outputs.sha }}-${{ hashFiles('output/runtime-sha.txt', 'upstream-runtime/deps/packages.cmake', 'scripts/patch-ios-touch-menu.py', 'scripts/patch-ios-lifecycle.py', 'scripts/patch-ios-streaming.py', 'scripts/patch-ios-pso-cache.py', 'native/pso_shards.h', 'native/pso_cache_policy.h', 'scripts/patch-ios-tessellation.py', 'scripts/patch-ios-observers.py', 'native/tess_inputs.h') }}
          restore-keys: |
            ios-gpu-xcode26.3-${{ steps.runtime_pin.outputs.sha }}-
            ${{ steps.runtime_pin.outputs.sha == '14dbd84263b3a08d001eb7fb1128e98f4c5f2be9' && 'ios-gpu-xcode26.3-add0b2e81d964111cccd227c63e2d2161aa4afb4aa2d4421229a1168302a9e0f' || '' }}
      - name: Build actual iOS Metal GPU library
        if: steps.ios-gpu-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          bash upstream-runtime/scripts/ios/build-gpu.sh 2>&1 | tee output/gpu-build.log
      - uses: actions/cache/save@v4
        if: steps.ios-gpu-cache.outputs.cache-hit != 'true'
        with:
          path: upstream-runtime/out/ios/gpu
          key: ${{ steps.ios-gpu-cache.outputs.cache-primary-key }}
      - name: Build actual runtime without GPU stubs
        run: |
          set -euo pipefail
          python3 scripts/patch-ios-memory-budget.py
          python3 scripts/patch-interpreter-diagnostics.py
          python3 scripts/patch-ios-locale.py
          "$(brew --prefix)/bin/bash" upstream-runtime/scripts/ios/build-core.sh 2>&1 | tee output/core-build.log
          cp upstream-runtime/out/ios/libbbios.a output/
          cp upstream-runtime/out/ios/gpu/libbbgpu.a output/
      - name: Package full native runtime unsigned IPA
        run: |
          set -euo pipefail
          bash scripts/package-native.sh 2>&1 | tee output/package-build.log
      - name: Collect GPU compiler diagnostics
        if: always()
        run: |
          if [ -f upstream-runtime/out/ios/gpu-build.log ]; then
            cp upstream-runtime/out/ios/gpu-build.log output/gpu-full-build.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-metal-runtime-diagnostics
          path: |
            output/*.ipa
            output/*.txt
            output/*.log
          retention-days: 14





