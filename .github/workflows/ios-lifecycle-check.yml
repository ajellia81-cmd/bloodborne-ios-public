name: iOS lifecycle SDK check
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/ios-lifecycle-check.yml']
permissions:
  contents: read
jobs:
  sdk:
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Compile lifecycle bridge with the actual iPhoneOS SDK
        run: |
          xcrun --sdk iphoneos clang -target arm64-apple-ios26.0 -O2 -c native/lifecycle.c -o lifecycle.o
          xcrun --sdk iphoneos clang -target arm64-apple-ios26.0 -O2 -fobjc-arc -c native/lifecycle.m -o lifecycle-objc.o
          xcrun nm -g lifecycle.o lifecycle-objc.o
