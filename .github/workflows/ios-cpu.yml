name: iOS CPU runtime link
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-cpu.yml'
      - 'ios/**'
concurrency:
  group: ios-cpu-main
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Fetch open source dependencies
        run: |
          set -euo pipefail
          mkdir -p output
          git clone --depth 1 https://github.com/bloodborne-native/bloodborne-runtime.git upstream-runtime
          git -C upstream-runtime submodule update --init --depth 1 recomp third_party/LibAtrac9
          git clone --depth 1 --branch release-3.4.18 https://github.com/libsdl-org/SDL.git upstream-sdl
          git clone --depth 1 --branch v4.1.1 --recursive --shallow-submodules https://github.com/zyantific/zydis.git upstream-zydis
          for repo in upstream-runtime upstream-runtime/recomp upstream-runtime/third_party/LibAtrac9 upstream-sdl upstream-zydis; do
            echo "$repo $(git -C "$repo" rev-parse HEAD)" >> output/source-versions.txt
          done
      - name: Configure iOS ARM64 CPU runtime
        run: |
          set -euo pipefail
          cmake -S ios -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DRUNTIME_SOURCE="$PWD/upstream-runtime" \
            -DSDL_SOURCE="$PWD/upstream-sdl" -DZYDIS_SOURCE="$PWD/upstream-zydis" \
            2>&1 | tee output/configure.log
      - name: Compile and link CPU-only runtime
        run: |
          set -euo pipefail
          cmake --build build-ios --parallel 3 2>&1 | tee output/build.log
          cp build-ios/bb-probe.app/bb-probe output/
          file output/bb-probe | tee output/binary.txt
          xcrun vtool -show-build output/bb-probe | tee output/platform.txt
          otool -L output/bb-probe | tee output/linkage.txt
      - name: Package unsigned CPU diagnostic IPA
        run: |
          set -euo pipefail
          mkdir -p output/Payload
          cp -R build-ios/BloodborneCPUProbe.app output/Payload/
          codesign --remove-signature output/Payload/BloodborneCPUProbe.app/BloodborneCPUProbe 2>/dev/null || true
          cd output
          zip -qr Bloodborne-CPUProbe-unsigned.ipa Payload
          unzip -l Bloodborne-CPUProbe-unsigned.ipa
      - name: Build simulator diagnostic app
        run: |
          set -euo pipefail
          cmake -S ios -B build-simulator -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DRUNTIME_SOURCE="$PWD/upstream-runtime" -DSDL_SOURCE="$PWD/upstream-sdl" \
            -DZYDIS_SOURCE="$PWD/upstream-zydis" > output/simulator-configure.log 2>&1
          cmake --build build-simulator --target BloodborneCPUProbe --parallel 3 2>&1 | tee output/simulator-build.log
      - name: Execute synthetic x86-64 addition in iOS simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > output/simulators.json
          device="$(python3 -c 'import json; d=json.load(open("output/simulators.json")); print(next(x["udid"] for v in d["devices"].values() for x in v if x.get("isAvailable") and x["name"].startswith("iPhone")))')"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" build-simulator/BloodborneCPUProbe.app
          SIMCTL_CHILD_BB_AUTOTEST=1 xcrun simctl launch --terminate-running-process "$device" com.ajellia81.bloodborne.cpuprobe
          data="$(xcrun simctl get_app_container "$device" com.ajellia81.bloodborne.cpuprobe data)"
          for attempt in {1..30}; do
            if [ -s "$data/Documents/cpu-result.txt" ]; then
              cp "$data/Documents/cpu-result.txt" output/simulator-cpu-result.txt
              cat output/simulator-cpu-result.txt
              grep '^PASS' output/simulator-cpu-result.txt
              exit 0
            fi
            sleep 1
          done
          echo "Simulator did not produce a CPU result" >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-cpu-runtime-diagnostics
          path: output/
          retention-days: 14
